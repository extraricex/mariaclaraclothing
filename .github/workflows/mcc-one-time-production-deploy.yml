name: MCC one-time production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure one-time SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.MCC_TEMP_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '[72.61.127.119]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKyMtetbwR+bGGVbcLESD6mn2Z5TnG+D3L1PgrsTE5FH' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Back up, deploy, and audit production
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -p 2222 root@72.61.127.119 'bash -s' <<'REMOTE'
          set -euo pipefail

          if command -v fail2ban-client >/dev/null 2>&1; then
            for jail in sshd ssh; do
              if fail2ban-client status "$jail" >/dev/null 2>&1; then
                fail2ban-client set "$jail" unbanip 111.90.220.87 >/dev/null || true
              fi
            done
          fi

          /usr/local/bin/mariaclara-backup
          cd /var/www/mariaclara
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          ./deploy/release-production.sh

          docker compose --env-file deploy/production.env -f deploy/docker-compose.production.yml exec -T api node <<'NODE'
          const { env } = require('./src/config/env');

          console.log(`META_CONFIG ${JSON.stringify({
            enabled: Boolean(env.meta?.enabled),
            pixelId: String(env.meta?.pixelId || ''),
            browserPurchaseEnabled: Boolean(env.meta?.browserPurchaseEnabled),
            currency: String(env.meta?.currency || ''),
            graphApiVersion: String(env.meta?.graphApiVersion || ''),
            accessTokenConfigured: Boolean(env.meta?.accessToken),
            globalTestEventCodeConfigured: Boolean(env.meta?.testEventCode)
          })}`);

          void fetch(
            `https://graph.facebook.com/${encodeURIComponent(env.meta.graphApiVersion)}/${encodeURIComponent(env.meta.pixelId)}?fields=id,name&access_token=${encodeURIComponent(env.meta.accessToken)}`
          ).then(async (response) => {
            const body = await response.json().catch(() => ({}));
            console.log(`META_TOKEN_DATASET ${JSON.stringify({
              ok: response.ok,
              id: String(body.id || ''),
              name: String(body.name || ''),
              errorCode: body.error?.code || null
            })}`);
          }).catch(() => {
            console.log('META_TOKEN_DATASET {"ok":false,"id":"","name":"","errorCode":"network_error"}');
          });
          NODE

          printf 'DEPLOYED_COMMIT %s\n' "$(git rev-parse HEAD)"
          curl -fsS http://127.0.0.1/api/health
          REMOTE
