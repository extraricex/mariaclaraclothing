# Maria Clara webstore — full stack.
#   docker compose up --build
# Storefront/admin (React):  http://localhost:8080   (admin at /admin)
# API + legacy static site:  http://localhost:3000
# Grafana dashboards:        http://localhost:3001
#
# SECURITY: the defaults below (postgres password, admin token/password,
# anonymous Grafana viewers) are for LOCAL USE ONLY. Override via environment
# variables or an .env file next to this compose file before deploying.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maria_clara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maria_clara"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/maria_clara
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:11.4.0
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  grafana-data:
