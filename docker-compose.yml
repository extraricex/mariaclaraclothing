# Maria Clara webstore — full stack.
#   docker compose up --build
# Storefront/admin (React):  http://localhost:8081   (admin at /admin)
# API + legacy static site:  http://localhost:3000
#
# SECURITY: the defaults below (postgres password, admin token/password) are for
# LOCAL USE ONLY. Override via environment variables or an .env file next to this
# compose file before deploying.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maria_clara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maria_clara"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/maria_clara
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CHECKOUT_V2_REQUIRED: ${CHECKOUT_V2_REQUIRED:-false}
      ORDER_CONFIRMATION_SECRET: ${ORDER_CONFIRMATION_SECRET:-}
      META_CONVERSIONS_API_ENABLED: ${META_CONVERSIONS_API_ENABLED:-false}
      META_PIXEL_ID: ${META_PIXEL_ID:-595813035761213}
      META_CONVERSIONS_API_ACCESS_TOKEN: ${META_CONVERSIONS_API_ACCESS_TOKEN:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      META_CONVERSIONS_API_TEST_EVENT_CODE: ${META_CONVERSIONS_API_TEST_EVENT_CODE:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_FACEBOOK_META_PIXEL_ENABLED: ${VITE_FACEBOOK_META_PIXEL_ENABLED:-true}
        VITE_FACEBOOK_META_PIXEL_ID: ${VITE_FACEBOOK_META_PIXEL_ID:-595813035761213}
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
