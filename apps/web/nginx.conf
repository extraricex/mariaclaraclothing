server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 350m;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Docker service addresses can change when a container is recreated. Resolve
  # the API name at request time instead of retaining the address from nginx
  # startup, so API-only releases recover without restarting the storefront.
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 1s;
  set $api_origin http://api:3000;

  # The gateway owns browser security headers. Hide the same upstream API
  # headers so proxied responses contain one unambiguous policy value.
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header Content-Security-Policy;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=15552000" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' https://connect.facebook.net https://www.facebook.com/signals/iwl.js; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https://www.facebook.com https://graph.facebook.com https://connect.facebook.net; frame-src 'self' https://www.facebook.com; upgrade-insecure-requests" always;

  location /api/ {
    proxy_pass $api_origin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_temporarily_unavailable;
  }

  location @api_temporarily_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "1" always;
    return 503 '{"success":false,"code":"SERVICE_TEMPORARILY_UNAVAILABLE","error":"The store is briefly reconnecting. Please try again in a moment."}';
  }

  location /uploads/ {
    proxy_pass $api_origin;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location /brand/ {
    proxy_pass $api_origin;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location /data/ {
    proxy_pass $api_origin;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location "/MANDALA WHITE/" {
    proxy_pass $api_origin;
  }

  location = /index.html {
    ssi on;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' https://connect.facebook.net https://www.facebook.com/signals/iwl.js; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https://www.facebook.com https://graph.facebook.com https://connect.facebook.net; frame-src 'self' https://www.facebook.com; upgrade-insecure-requests" always;
  }

  # This runtime configuration can change independently of hashed bundles. It
  # must never remain at an edge after a tracking release or configuration fix.
  location = /meta-bootstrap.js {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    proxy_pass $api_origin/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /merchant-feed.xml {
    proxy_pass $api_origin/merchant-feed.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /robots.txt {
    proxy_pass $api_origin/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ ^/product/(?<storefront_product_slug>[^/]+)/?$ {
    proxy_pass $api_origin/api/products/$storefront_product_slug/route;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 =404 /index.html?seo_path=$uri;
  }

  # Resolve legacy Shopify plural product URLs directly against the canonical
  # product map so an old alias redirects in one hop without a redirect chain.
  location ~ ^/products/oranges-mcc-box-tee/?$ {
    return 301 /product/mariaclara-orange-crop-box-240-gsm-shirt$is_args$args;
  }

  location ~ ^/products/(?<legacy_product_slug>[^/]+)/?$ {
    proxy_pass $api_origin/api/products/$legacy_product_slug/route?legacy_plural=1&$args;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 =404 /index.html?seo_path=$uri;
  }

  # Collection routing mirrors product routing: current slugs render normally,
  # recorded prior slugs redirect permanently, and unknown slugs remain true 404s.
  location ~ ^/collections/(?<storefront_collection_slug>[^/]+)/?$ {
    proxy_pass $api_origin/api/collections/$storefront_collection_slug/route;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 =404 /index.html?seo_path=$uri;
  }

  location = /collections/all {
    return 301 /shop$is_args$args;
  }

  location = /pages/terms-of-use {
    return 301 /terms$is_args$args;
  }

  location = /pages/contact {
    return 301 /contact$is_args$args;
  }

  location = /pages/faq {
    return 301 /faq$is_args$args;
  }

  location ~ ^/pages/(?:shipping-returns|shipping-and-returns)/?$ {
    return 301 /shipping-returns$is_args$args;
  }

  location = /pages/size-chart {
    return 301 /size-chart$is_args$args;
  }

  location ~ ^/policies/(?:terms-of-service|privacy-policy)/?$ {
    return 301 /terms$is_args$args;
  }

  location ~ ^/policies/(?:refund-policy|shipping-policy)/?$ {
    return 301 /shipping-returns$is_args$args;
  }

  # Known client routes receive the SPA with a normal 200 response.
  location ~ ^/(?:shop|guides/(?:240-gsm-shirts|t-shirt-fit-guide|payment-and-shipping)|cart|thank-you|login|register|forgot-password|reset-password|account(?:/settings)?|faq|shipping-returns|terms|contact|size-chart|checkout(?:/review)?|admin(?:/login|/orders(?:/draft|/abandoned-checkout|/[^/]+)?|/products(?:/countdown|/[^/]+)?|/collections|/marketing/seo|/inventory|/customers|/payments|/discounts(?:/[^/]+)?|/reviews(?:/import|/settings)?|/banners|/settings|/pancake|/issue-reports|/analytics(?:/funnel|/checkout-issues|/meta-reconciliation)?)?)/?$ {
    try_files $uri /index.html?seo_path=$uri;
  }

  location = / {
    rewrite ^ /index.html?seo_path=/ last;
  }

  # Unknown routes still render the React not-found page, but keep HTTP 404.
  error_page 403 =404 /index.html?seo_path=$uri;
  error_page 404 =404 /index.html?seo_path=$uri;

  location / {
    try_files $uri $uri/ =404;
  }
}
