server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 350m;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=15552000" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https://www.facebook.com https://graph.facebook.com https://connect.facebook.net; frame-src 'self' https://www.facebook.com; upgrade-insecure-requests" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location /brand/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location /data/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location "/MANDALA WHITE/" {
    proxy_pass http://api:3000;
  }

  location = /index.html {
    ssi on;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https://www.facebook.com https://graph.facebook.com https://connect.facebook.net; frame-src 'self' https://www.facebook.com; upgrade-insecure-requests" always;
  }

  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    proxy_pass http://api:3000/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /merchant-feed.xml {
    proxy_pass http://api:3000/merchant-feed.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /robots.txt {
    proxy_pass http://api:3000/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ ^/product/(?<storefront_product_slug>[^/]+)/?$ {
    proxy_pass http://api:3000/api/products/$storefront_product_slug/route;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 =404 /index.html;
  }

  # Known client routes receive the SPA with a normal 200 response.
  location ~ ^/(?:shop|collections/[^/]+|guides/(?:240-gsm-shirts|t-shirt-fit-guide|payment-and-shipping)|cart|thank-you|login|register|forgot-password|reset-password|account(?:/settings)?|faq|shipping-returns|terms|contact|size-chart|checkout(?:/review)?|admin(?:/login|/orders(?:/draft|/abandoned-checkout|/[^/]+)?|/products(?:/countdown|/[^/]+)?|/collections|/inventory|/customers|/payments|/discounts(?:/[^/]+)?|/reviews(?:/import|/settings)?|/banners|/settings|/pancake|/issue-reports|/analytics)?)/?$ {
    try_files $uri /index.html?seo_path=$uri;
  }

  location = / {
    rewrite ^ /index.html?seo_path=/ last;
  }

  # Unknown routes still render the React not-found page, but keep HTTP 404.
  error_page 403 =404 /index.html?seo_path=$uri;
  error_page 404 =404 /index.html?seo_path=$uri;

  location / {
    try_files $uri $uri/ =404;
  }
}
