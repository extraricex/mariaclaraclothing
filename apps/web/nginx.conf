server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 350m;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https://www.facebook.com https://graph.facebook.com" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /uploads/ {
    proxy_pass http://api:3000;
  }

  location /brand/ {
    proxy_pass http://api:3000;
  }

  location /data/ {
    proxy_pass http://api:3000;
  }

  location "/MANDALA WHITE/" {
    proxy_pass http://api:3000;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' https://www.facebook.com https://graph.facebook.com" always;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location ~ ^/product/(?<storefront_product_slug>[^/]+)/?$ {
    proxy_pass http://api:3000/api/products/$storefront_product_slug/route;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 =404 /index.html;
  }

  # Known client routes receive the SPA with a normal 200 response.
  location ~ ^/(?:collections/[^/]+|cart|thank-you|login|register|account(?:/settings)?|faq|shipping-returns|terms|contact|size-chart|checkout(?:/review)?|admin(?:/login|/orders(?:/draft|/abandoned-checkout|/[^/]+)?|/products(?:/countdown|/[^/]+)?|/collections|/inventory|/customers|/payments|/discounts(?:/[^/]+)?|/banners|/settings|/pancake|/issue-reports)?)/?$ {
    try_files $uri /index.html;
  }

  location = / {
    try_files /index.html =404;
  }

  # Unknown routes still render the React not-found page, but keep HTTP 404.
  error_page 403 =404 /index.html;
  error_page 404 =404 /index.html;

  location / {
    try_files $uri $uri/ =404;
  }
}
