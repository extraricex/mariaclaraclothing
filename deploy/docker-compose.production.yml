# Maria Clara Clothing production stack.
#
# Run from the repository root:
#   docker compose --env-file deploy/production.env -f deploy/docker-compose.production.yml up -d --build
#
# The web service is the public entrypoint on port 80. Keep the api and postgres
# services private to this Docker network.

name: maria-clara-clothing

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  api:
    build: ../apps/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      CUSTOMER_AUTH_SECRET: ${CUSTOMER_AUTH_SECRET:?CUSTOMER_AUTH_SECRET is required}
      AUTH_SECRET: ${AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      AUTH_CALLBACK_URL: ${AUTH_CALLBACK_URL:?AUTH_CALLBACK_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CHECKOUT_V2_REQUIRED: ${CHECKOUT_V2_REQUIRED:-true}
      ORDER_CONFIRMATION_SECRET: ${ORDER_CONFIRMATION_SECRET:?ORDER_CONFIRMATION_SECRET is required}
      CART_RECOVERY_SECRET: ${CART_RECOVERY_SECRET:?CART_RECOVERY_SECRET is required}
      ANALYTICS_HASH_SALT: ${ANALYTICS_HASH_SALT:?ANALYTICS_HASH_SALT is required}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:?PASSWORD_RESET_SECRET is required}
      REVIEW_IMPORT_SECRET: ${REVIEW_IMPORT_SECRET:-}
      PANCAKE_MODE: ${PANCAKE_MODE:-disabled}
      PANCAKE_API_BASE_URL: ${PANCAKE_API_BASE_URL:-https://pos.pages.fm/api/v1}
      PANCAKE_API_KEY: ${PANCAKE_API_KEY:-}
      PANCAKE_SHOP_ID: ${PANCAKE_SHOP_ID:-}
      PANCAKE_WAREHOUSE_ID: ${PANCAKE_WAREHOUSE_ID:-}
      PANCAKE_ORDER_SOURCE_ID: ${PANCAKE_ORDER_SOURCE_ID:-}
      PANCAKE_WEBHOOK_SECRET: ${PANCAKE_WEBHOOK_SECRET:-}
      PANCAKE_REQUEST_TIMEOUT_MS: ${PANCAKE_REQUEST_TIMEOUT_MS:-20000}
      PANCAKE_CATALOG_PAGE_SIZE: ${PANCAKE_CATALOG_PAGE_SIZE:-100}
      PANCAKE_CATALOG_MAX_PAGES: ${PANCAKE_CATALOG_MAX_PAGES:-100}
      PANCAKE_AUTO_SYNC_ENABLED: ${PANCAKE_AUTO_SYNC_ENABLED:-}
      PANCAKE_AUTO_SYNC_INTERVAL_MS: ${PANCAKE_AUTO_SYNC_INTERVAL_MS:-}
      PANCAKE_SYNC_ENABLED: ${PANCAKE_SYNC_ENABLED:-}
      PANCAKE_SYNC_INTERVAL_MINUTES: ${PANCAKE_SYNC_INTERVAL_MINUTES:-3}
      PANCAKE_AUTO_SYNC_STARTUP_DELAY_MS: ${PANCAKE_AUTO_SYNC_STARTUP_DELAY_MS:-15000}
      PANCAKE_ORDER_POLL_INTERVAL_MS: ${PANCAKE_ORDER_POLL_INTERVAL_MS:-300000}
      PANCAKE_ORDER_POLL_PAGE_SIZE: ${PANCAKE_ORDER_POLL_PAGE_SIZE:-50}
      PANCAKE_ORDER_POLL_LOOKBACK_MS: ${PANCAKE_ORDER_POLL_LOOKBACK_MS:-900000}
      PANCAKE_SYNC_MAX_ATTEMPTS: ${PANCAKE_SYNC_MAX_ATTEMPTS:-10}
      PANCAKE_ORDER_EXPORT_CUTOFF_AT: ${PANCAKE_ORDER_EXPORT_CUTOFF_AT:-}
      PAYMONGO_ENABLED: ${PAYMONGO_ENABLED:-false}
      PAYMONGO_API_BASE_URL: ${PAYMONGO_API_BASE_URL:-https://api.paymongo.com}
      PAYMONGO_PUBLIC_KEY: ${PAYMONGO_PUBLIC_KEY:-}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET:-}
      PAYMONGO_SUCCESS_URL: ${PAYMONGO_SUCCESS_URL:-https://mariaclaraclothing.com/thank-you}
      PAYMONGO_CANCEL_URL: ${PAYMONGO_CANCEL_URL:-https://mariaclaraclothing.com/checkout}
      PAYMONGO_PAYMENT_METHOD_TYPES: ${PAYMONGO_PAYMENT_METHOD_TYPES:-card,gcash,paymaya,qrph}
      PAYMONGO_RESERVATION_MINUTES: ${PAYMONGO_RESERVATION_MINUTES:-30}
      META_CONVERSIONS_API_ENABLED: ${META_CONVERSIONS_API_ENABLED:-false}
      META_PIXEL_ID: ${META_PIXEL_ID:-595813035761213}
      META_CURRENCY: ${META_CURRENCY:-PHP}
      META_CONVERSIONS_API_ACCESS_TOKEN: ${META_CONVERSIONS_API_ACCESS_TOKEN:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      META_CONVERSIONS_API_TEST_EVENT_CODE: ${META_CONVERSIONS_API_TEST_EVENT_CODE:-}
      ORDER_NOTIFICATIONS_ENABLED: ${ORDER_NOTIFICATIONS_ENABLED:-false}
      SEMAPHORE_API_KEY: ${SEMAPHORE_API_KEY:-}
      SEMAPHORE_SENDER_NAME: ${SEMAPHORE_SENDER_NAME:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ORDER_NOTIFICATION_FROM_EMAIL: ${ORDER_NOTIFICATION_FROM_EMAIL:-}
      ORDER_NOTIFICATION_EMAIL: ${ORDER_NOTIFICATION_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      JNT_INTEGRATION_MODE: ${JNT_INTEGRATION_MODE:-dry_run}
      JNT_API_BASE_URL: ${JNT_API_BASE_URL:-}
      JNT_API_CUSTOMER_CODE: ${JNT_API_CUSTOMER_CODE:-}
      JNT_API_KEY: ${JNT_API_KEY:-}
      ADMIN_LOGIN_RATE_LIMIT_MAX: ${ADMIN_LOGIN_RATE_LIMIT_MAX:-50}
      ADMIN_LOGIN_RATE_LIMIT_WINDOW_MS: ${ADMIN_LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      CHECKOUT_RATE_LIMIT_MAX: ${CHECKOUT_RATE_LIMIT_MAX:-100}
      CHECKOUT_RATE_LIMIT_WINDOW_MS: ${CHECKOUT_RATE_LIMIT_WINDOW_MS:-600000}
      CUSTOMER_AUTH_RATE_LIMIT_MAX: ${CUSTOMER_AUTH_RATE_LIMIT_MAX:-30}
      CUSTOMER_AUTH_RATE_LIMIT_WINDOW_MS: ${CUSTOMER_AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-8}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_MS: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MS:-3600000}
      CUSTOMER_OAUTH_RATE_LIMIT_MAX: ${CUSTOMER_OAUTH_RATE_LIMIT_MAX:-60}
      CUSTOMER_OAUTH_RATE_LIMIT_WINDOW_MS: ${CUSTOMER_OAUTH_RATE_LIMIT_WINDOW_MS:-900000}
      QUOTE_RATE_LIMIT_MAX: ${QUOTE_RATE_LIMIT_MAX:-120}
      QUOTE_RATE_LIMIT_WINDOW_MS: ${QUOTE_RATE_LIMIT_WINDOW_MS:-600000}
      CART_RATE_LIMIT_MAX: ${CART_RATE_LIMIT_MAX:-180}
      CART_RATE_LIMIT_WINDOW_MS: ${CART_RATE_LIMIT_WINDOW_MS:-600000}
      ANALYTICS_RATE_LIMIT_MAX: ${ANALYTICS_RATE_LIMIT_MAX:-300}
      ANALYTICS_RATE_LIMIT_WINDOW_MS: ${ANALYTICS_RATE_LIMIT_WINDOW_MS:-600000}
      ORDER_LOOKUP_RATE_LIMIT_MAX: ${ORDER_LOOKUP_RATE_LIMIT_MAX:-120}
      ORDER_LOOKUP_RATE_LIMIT_WINDOW_MS: ${ORDER_LOOKUP_RATE_LIMIT_WINDOW_MS:-600000}
      ADMIN_SENSITIVE_RATE_LIMIT_MAX: ${ADMIN_SENSITIVE_RATE_LIMIT_MAX:-40}
      ADMIN_SENSITIVE_RATE_LIMIT_WINDOW_MS: ${ADMIN_SENSITIVE_RATE_LIMIT_WINDOW_MS:-900000}
      ISSUE_REPORT_RATE_LIMIT_MAX: ${ISSUE_REPORT_RATE_LIMIT_MAX:-20}
      ISSUE_REPORT_RATE_LIMIT_WINDOW_MS: ${ISSUE_REPORT_RATE_LIMIT_WINDOW_MS:-600000}
      REVIEW_SUBMISSION_RATE_LIMIT_MAX: ${REVIEW_SUBMISSION_RATE_LIMIT_MAX:-8}
      REVIEW_SUBMISSION_RATE_LIMIT_WINDOW_MS: ${REVIEW_SUBMISSION_RATE_LIMIT_WINDOW_MS:-3600000}
      ISSUE_UPLOAD_DIR: /app/private-uploads/issues
    volumes:
      - uploads:/app/public/uploads
      - issue_uploads:/app/private-uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        # nginx can serve the storefront while the API completes its health
        # checks. Browser GET recovery covers the short API handover window.
        condition: service_started
    logging: *default-logging

volumes:
  postgres_data:
    name: maria_clara_postgres_data
  uploads:
    name: maria_clara_uploads
  issue_uploads:
    name: maria_clara_issue_uploads
